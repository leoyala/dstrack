#:schema https://www.schemastore.org/prek.json
# prek.toml
#
# Setup:
#   uv tool install prek            # or: pip install prek
#   prek install                    # installs the git hook
#   prek run --all-files            # run once across the whole repo
#
# Maintenance:
#   prek auto-update                # bump all `rev` pins to latest
#   prek util list-builtins         # hooks prek implements natively in Rust
#
# Docs: https://prek.j178.dev

minimum_prek_version = "0.5.11"

default_language_version = { python = "python3.11" }

# Keep commits fast: only run on the commit stage by default.
default_stages = ["pre-commit"]

# Don't run hooks on generated / vendored / data paths.
exclude = '''
(?x)^(
    \.git/.*|
    \.venv/.*|
    build/.*|
    dist/.*|
    docs/_build/.*|
    .*\.egg-info/.*|
    data/.*|
    datasets/.*|
    .*\.ipynb_checkpoints/.*
)$
'''

# -----------------------------------------------------------------------------
# Core hygiene: cheap, fast, catch-everything checks.
# prek's automatic fast path runs its built-in Rust implementation for every
# hook here except `debug-statements`, which falls back to the pinned Python
# hook. See https://prek.j178.dev/built-in-hooks/#use-the-automatic-fast-path
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-symlinks" },
  { id = "debug-statements" },                                # blocks stray breakpoint()/pdb (no builtin)
  { id = "detect-private-key" },                              # blocks committed private keys
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
]

# -----------------------------------------------------------------------------
# Ruff: linter + formatter (replaces flake8, isort, black, pyupgrade, etc.).
# Lint (with --fix) MUST run before the formatter.
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"
hooks = [
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi", "jupyter"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter"] },
]

# -----------------------------------------------------------------------------
# Static type checking. Paths are configured in pyproject.toml under [tool.ty].
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.107"
hooks = [
  { id = "ty" },
]

# -----------------------------------------------------------------------------
# Spelling: catches typos in code, docstrings, and docs.
# Configure ignores in pyproject.toml under [tool.codespell].
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"
hooks = [
  { id = "codespell", additional_dependencies = ["tomli"] },
]

# -----------------------------------------------------------------------------
# Notebooks: strip outputs before commit (clean diffs, no data leakage).
# Essential for ML repos that carry .ipynb files.
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/kynan/nbstripout"
rev = "0.9.1"
hooks = [
  { id = "nbstripout" },
]

# -----------------------------------------------------------------------------
# Secret scanning (baseline-driven). Generate the baseline once with:
#   detect-secrets scan > .secrets.baseline
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"
hooks = [
  { id = "detect-secrets", args = ["--baseline", ".secrets.baseline"] },
]

# -----------------------------------------------------------------------------
# uv lock file update to make sure it is properly synced even if the
# dependencies have been updated.
# -----------------------------------------------------------------------------
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.8"  # uv version
hooks = [
  { id = "uv-lock" },
]
